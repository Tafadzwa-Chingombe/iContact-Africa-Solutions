name: Update sitemap

on:
  push:
    branches: [main]
    paths-ignore: ['sitemap.xml']
  schedule:
    - cron: '17 3 * * *'   # daily, picks up newly published blog posts
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sitemap
  cancel-in-progress: true

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so each page gets its real last-modified date
      - name: Build sitemap.xml
        run: python3 scripts/build_sitemap.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- sitemap.xml; then echo "sitemap unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "Update sitemap.xml"
          git push
