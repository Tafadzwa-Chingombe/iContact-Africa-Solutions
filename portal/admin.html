<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Admin Console — iContact Africa Solutions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../assets/img/favicon-16.png">
<link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
<link rel="manifest" href="../site.webmanifest">
<link rel="stylesheet" href="../assets/css/prose.css">
<link rel="stylesheet" href="portal.css">
</head>
<body class="app-body is-admin is-loading">

<aside class="sidebar" id="sidebar">
  <a href="../index.html" class="logo logo-light">
    <img class="logo-img" src="../assets/img/icontact-logo-white.png" alt="iContact Africa Solutions" width="148" height="34">
    <span class="logo-tag">Admin Console</span>
  </a>
  <nav class="side-nav" aria-label="Admin">
    <a href="#overview" data-route="overview"><svg viewBox="0 0 24 24"><path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z"/></svg>Overview</a>
    <a href="#clients" data-route="clients"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M1 21a8 8 0 0 1 16 0M17 4a4 4 0 0 1 0 8M23 21a8 8 0 0 0-5-7.4"/></svg>Clients</a>
    <a href="#tickets" data-route="tickets"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Support queue<span class="nav-count" data-count="tickets"></span></a>
    <a href="#approvals" data-route="approvals"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>Approvals<span class="nav-count" data-count="approvals"></span></a>
    <a href="#billing" data-route="billing"><svg viewBox="0 0 24 24"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2zM9 7h6M9 11h6M9 15h4"/></svg>Billing</a>
    <a href="#blog" data-route="blog"><svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>Blog</a>
    <a href="#enquiries" data-route="enquiries"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zM4 4l8 8 8-8"/></svg>Enquiries<span class="nav-count" data-count="enquiries"></span></a>
  </nav>
  <div class="side-foot">
    <a href="index.html" class="side-admin">Client view →</a>
    <p>Admin console<br><span>Signed in as staff</span></p>
  </div>
</aside>

<div class="app-main">
  <header class="topbar">
    <button class="icon-btn menu-btn" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false">
      <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <div class="topbar-title">
      <p class="eyebrow" id="view-eyebrow">Admin</p>
      <h1 id="view-title">Overview</h1>
    </div>
    <div class="topbar-user">
      <span class="avatar" id="user-avatar">··</span>
      <div class="user-meta"><strong id="user-name">Loading…</strong><span id="user-company"></span></div>
      <button class="btn btn-ghost btn-sm" id="signout">Sign out</button>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1" aria-live="polite">
    <div class="skeleton-grid"><div></div><div></div><div></div><div></div></div>
  </main>
</div>

<div class="scrim" hidden></div>

<dialog class="modal" id="modal">
  <div class="modal-inner">
    <button class="icon-btn modal-close" aria-label="Close" data-close>
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="modal-body"></div>
  </div>
</dialog>

<script type="module" src="js/admin.js"></script>
</body>
</html>
